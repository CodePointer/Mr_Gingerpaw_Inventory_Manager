name: Deploy database to Supabase

on:
  push:
    branches: [main]
    paths:
      - "backend/migrations/**"
      - "backend/app/models/**"
      - "backend/alembic.ini"
      - "backend/requirements.txt"
      - ".github/workflows/deploy-database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Alembic migrations
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install migration dependencies
        run: python -m pip install alembic sqlalchemy psycopg2-binary pgvector

      - name: Verify migration history
        run: python -m alembic -c alembic.ini heads

      - name: Apply migrations
        run: python -m alembic -c alembic.ini upgrade head

      - name: Check models for migration drift
        run: python -m alembic -c alembic.ini check

      - name: Show deployed revision
        run: python -m alembic -c alembic.ini current
